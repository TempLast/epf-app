name: TP2-CI

on: 
  push:
    paths-ignore:
      - '*.md'
    branches:
      -main

  pull_request:
    paths-ignore:
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint


  test:
    rs-on: ubuntu-latest
    strat
     maix:
      node : [20, 22]
    timeout-minutes: 10 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm test

      
  build:
   needs: [lint, test]
   runs-on: ubuntu-latest
   timeout-minutes: 10 
   steps:
    - uses: actions/checkout@v4
    - run: npm ci
    - run: npm run build
    - run: du -sh dist >> $GITHUB_STEP_SUMMARY
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
      name: Dist size [Log]
      

      
    


