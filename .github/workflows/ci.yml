name: TP2-CI

on: 
  push:
    paths-ignore:
      - '*.md'
    branches:
      -main

  pull_request:
    paths-ignore:
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10 
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint


  test:
    runs-on: ubuntu-latest
    strategy:
     matrix:
      node : [20, 22]
    timeout-minutes: 10 
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm test

      
  build:
   needs: [lint, test]
   runs-on: ubuntu-latest
   timeout-minutes: 10 
   steps:
    - uses: actions/checkout@v7
    - run: npm ci
    - run: npm run build
    - run: du -sh dist >> $GITHUB_STEP_SUMMARY
    - uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
      name: Dist size [Log]

  secrets:
    runs-on: ubuntu-latest
    steps:
     - uses: actions/checkout@v7
       with:
        fetch-depth: 0 # tout l'historique, pas seulement le dernier commit
     - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo -v

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.179.0 semgrep scan --error --config p/javascript


      

        
    


